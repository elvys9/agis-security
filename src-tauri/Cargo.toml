[package]
name = "aegis-security"
version = "0.1.1"
edition = "2021"

[lib]
name = "aegis_engine"
crate-type = ["rlib"]

[[bin]]
name = "aegis-security"
path = "src/main.rs"
required-features = ["desktop"]

[features]
default = ["desktop", "yara"]
desktop = ["dep:tauri", "dep:tauri-plugin-dialog", "dep:tauri-plugin-notification", "dep:tauri-plugin-autostart", "dep:tauri-plugin-single-instance", "dep:tauri-build"]
yara = ["dep:yara-x"]

[build-dependencies]
tauri-build = { version = "2", optional = true , features = [] }

[dependencies]
anyhow = "1"
yara-x = { version = "1.22", optional = true, default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
md-5 = "0.10"
hex = "0.4"
walkdir = "2"
notify = "8"
crossbeam-channel = "0.5"
aes-gcm = "0.10"
rand = "0.8"
zeroize = "1"
tempfile = "3"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
dirs = "6"
ed25519-dalek = "2"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
tauri = { version = "2", optional = true, features = ["tray-icon"] }
tauri-plugin-dialog = { version = "2", optional = true }
tauri-plugin-notification = { version = "2", optional = true }
tauri-plugin-autostart = { version = "2", optional = true }
tauri-plugin-single-instance = { version = "2", optional = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Security_Cryptography", "Win32_System_Threading", "Win32_System_Memory", "Win32_Storage_FileSystem", "Win32_System_Diagnostics_ToolHelp", "Win32_System_Registry"] }

[dev-dependencies]
tempfile = "3"
